name: PF Poker Android APK
on:
  push:
    branches: [pf-poker-android]
    paths:
      - 'pf-mobile/**'
      - '.github/workflows/build-pf-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build installable Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
      - name: Extract PF Poker Expo project
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/pf-poker-app"
          base64 -d pf-mobile/mobile-build-bundle.base64 | tar -xz -C "$RUNNER_TEMP/pf-poker-app"
          test -f "$RUNNER_TEMP/pf-poker-app/App.tsx"
          test -f "$RUNNER_TEMP/pf-poker-app/package.json"
      - name: Install Expo dependencies
        working-directory: ${{ runner.temp }}/pf-poker-app
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Check mobile TypeScript
        working-directory: ${{ runner.temp }}/pf-poker-app
        run: npx tsc --noEmit
      - name: Generate native Android application
        working-directory: ${{ runner.temp }}/pf-poker-app
        run: npx expo prebuild --platform android --no-install
      - name: Compile standalone APK
        working-directory: ${{ runner.temp }}/pf-poker-app/android
        run: chmod +x gradlew && ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Save Android APK
        uses: actions/upload-artifact@v4
        with:
          name: PF-Poker-Android-APK
          path: ${{ runner.temp }}/pf-poker-app/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
